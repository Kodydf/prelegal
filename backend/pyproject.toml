[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal V1 backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "litellm>=1.101.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real LLM (skipped without an API key)"]

[tool.uv]
package = false
